# Compila el APK de Android y lo publica en "Releases" cada vez que se suben cambios.
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04   # ya trae el SDK de Android instalado
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar el proyecto
        run: |
          npm ci
          npx cap sync android

      - name: Cargar la firma
        env:
          FIRMA_BASE64: ${{ secrets.FIRMA_BASE64 }}
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
        run: |
          if [ -n "$FIRMA_BASE64" ]; then
            # Se sacan espacios y saltos de línea que se cuelan al copiar y pegar
            if ! printf '%s' "$FIRMA_BASE64" | tr -d ' \r\n\t"' | base64 -d > "$RUNNER_TEMP/firma.jks" 2>/dev/null; then
              echo "::error::El secret FIRMA_BASE64 está mal copiado: tiene que ser TODO el texto del archivo FIRMA_BASE64.txt (unos 3568 caracteres, empieza con MII). Largo recibido: $(printf '%s' "$FIRMA_BASE64" | tr -d ' \r\n\t' | wc -c)"
              exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/firma.jks" -storepass "$FIRMA_CLAVE" >/dev/null 2>&1; then
              echo "::error::La firma no abre con FIRMA_CLAVE: revisá que FIRMA_CLAVE sea exactamente el texto de FIRMA_CLAVE.txt (23 caracteres, sin espacios). Largo recibido: ${#FIRMA_CLAVE}"
              exit 1
            fi
            echo "FIRMA_ARCHIVO=$RUNNER_TEMP/firma.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secret FIRMA_BASE64: el APK sale con firma de prueba y no se podrá actualizar encima de otra versión."
          fi

      - name: Compilar
        working-directory: android
        env:
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
          NUMERO_VERSION: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Consulta-CUIT-BCRA.apk

      # Sin la firma definitiva el APK queda solo como prueba (en la pestaña Actions), no se publica
      - name: Guardar APK de prueba
        if: env.FIRMA_ARCHIVO == ''
        uses: actions/upload-artifact@v4
        with:
          name: APK-de-prueba
          path: Consulta-CUIT-BCRA.apk

      - name: Publicar en Releases
        if: env.FIRMA_ARCHIVO != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Consulta-CUIT-BCRA.apk \
            --title "Consulta CUIT BCRA - App Android 1.0.${{ github.run_number }}" \
            --notes "Descargá **Consulta-CUIT-BCRA.apk** desde el teléfono y abrilo para instalar."
